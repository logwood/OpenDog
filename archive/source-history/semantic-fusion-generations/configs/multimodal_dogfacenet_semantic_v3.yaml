# Fusion v3 development stage. The proven joint800 identity encoders are
# transferred with --warm-start-scope encoders and remain frozen. Only the
# nose-to-face adapter, semantic reliability gate, bounded interaction block,
# and new 700-way development classifiers are optimized.
MULTIMODAL:
  ENABLED: True
  NOSE_CONFIG: artifacts/runs/legacy/s101_224/config.yaml
  NOSE_WEIGHTS: artifacts/runs/legacy/s101_224/model_final.pth
  IDENTITY_WEIGHTS: ""
  ARCFACE_WEIGHTS: models/pretrained/dog.pt
  ANYFACE_ROOT: third_party/AnyFace
  ANYFACE_WEIGHTS: models/pretrained/anyface/yolov5l6_best.pt
  SAM2_CHECKPOINT: models/pretrained/sam2/sam2.1_hiera_tiny.pt
  SAM2_CONFIG: configs/sam2.1/sam2.1_hiera_t.yaml
  ANYFACE_IMAGE_SIZE: 800
  ANYFACE_CONFIDENCE: 0.20
  MAX_LONG_SIDE: 1280
  NOSE_SIZE: [244, 244]
  FACE_SIZE: [224, 224]
  # Face is the protected anchor when both branches are present.
  NOSE_PRIOR: 0.10
  FACE_PRIOR: 0.90
  NUM_CLASSES: 0
  NOSE_TRAINABLE_PARTS: []
  ARCFACE_TRAINABLE_PARTS: []
  JOINT_ENABLED: True
  FUSION_MODE: semantic_residual_v3
  JOINT_DIM: 512
  ADAPTER_BOTTLENECK_DIM: 128
  JOINT_INITIAL_MIX: 0.50
  MODALITY_DROPOUT: 0.10
  CROSS_VIEW_WEIGHT: 0.20
  CROSS_MODAL_WEIGHT: 0.25
  BRANCH_CONSISTENCY_WEIGHT: 0.0
  SEMANTIC_MAX_NOSE_WEIGHT: 0.35
  SEMANTIC_RESIDUAL_SCALE: 0.05
  SEMANTIC_CONFLICT_WEIGHT: 0.75
  SEMANTIC_CONFLICT_MARGIN: 0.05
  DOMINANCE_WEIGHT: 0.50
  DOMINANCE_TOLERANCE: 0.02
  CONTRASTIVE_TEMPERATURE: 0.10
  CONTRASTIVE_POSE_BOOST: 1.0
  VIEWPOINT_NOSE_PENALTY: 0.35
  VIEWPOINT_NOSE_FLOOR: 0.50
  ALLOW_RAW_NOSE_FALLBACK: True
  CACHE_DIR: artifacts/runs/legacy/multimodal_cache_semantic_v3
