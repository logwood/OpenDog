_BASE_: modern_latent_v2_smoke.yaml

# 32 images / batch 8 = 4 optimizer updates per epoch. Twenty-five epochs are
# exactly 100 updates: enough to expose non-learning or slot collapse without a
# full run. Freeze the pretrained CNN so this measures the new path directly.
MODEL:
  BACKBONE:
    PRETRAIN: True
  LATENT_WORKSPACE:
    HEALTH_PERIOD: 10
    EARLY_ABORT_WARMUP_ITERS: 50
    EARLY_ABORT_PATIENCE: 2

SOLVER:
  MAX_EPOCH: 25
  WARMUP_ITERS: 20
  FREEZE_ITERS: 100000
  # Save only the terminal microfit state.
  CHECKPOINT_PERIOD: 25

TEST:
  EVAL_PERIOD: 100000

DATASETS:
  TESTS: ()

OUTPUT_DIR: artifacts/runs/legacy/modern_latent_v2_microfit_d192
