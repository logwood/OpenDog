_BASE_: modern_latent_v3_smoke.yaml

# Exactly 100 optimizer updates on eight identities with the CNN frozen. This
# exposes dead query/gate paths or renewed slot collapse before the full run.
MODEL:
  BACKBONE:
    PRETRAIN: True
  LATENT_WORKSPACE:
    HEALTH_PERIOD: 10
    EARLY_ABORT_WARMUP_ITERS: 50
    EARLY_ABORT_PATIENCE: 2

SOLVER:
  MAX_EPOCH: 25
  WARMUP_ITERS: 20
  FREEZE_ITERS: 100000
  CHECKPOINT_PERIOD: 25

TEST:
  EVAL_PERIOD: 100000

DATASETS:
  TESTS: ()

OUTPUT_DIR: artifacts/runs/legacy/modern_latent_v3_microfit_d192
