    IDENTITY_FUSION_LOSS_WEIGHT: 0.10
    IDENTITY_FUSION_WEIGHT_MIN: 0.0
    IDENTITY_FUSION_WEIGHT_MAX: 0.5
    IDENTITY_FUSION_WEIGHT_INIT: 0.05
    HEALTH_PERIOD: 50
    EARLY_ABORT_ENABLED: True
    EARLY_ABORT_WARMUP_ITERS: 100
    EARLY_ABORT_PATIENCE: 2
    EARLY_ABORT_SLOT_COSINE_MAX: 0.995
    EARLY_ABORT_MIN_EFFECTIVE_RANK: 2.0
    EARLY_ABORT_QUERY_COSINE_MAX: 0.995
    EARLY_ABORT_MIN_QUERY_RANK: 1.5

SOLVER:
  CHECKPOINT_PERIOD: 5

OUTPUT_DIR: artifacts/runs/structural-latent/modern_structural_s101_224
