_BASE_: resnest101_224_baseline.yaml

# Full identity-disjoint model-selection run on the remote RTX 3090 host.
# Training: 5,400 identities. Validation: 600 unseen identities / 2,000 pairs.
SEED: 2022

SOLVER:
  AMP:
    ENABLED: True
  IMS_PER_BATCH: 80
  WARMUP_ITERS: 400
  FREEZE_ITERS: 1000
  CHECKPOINT_PERIOD: 1

DATALOADER:
  NUM_WORKERS: 8

DATASETS:
  NAMES: ("PetID",)
  TESTS: ("PetIDValidation",)

TEST:
  EVAL_PERIOD: 1
  IMS_PER_BATCH: 128

OUTPUT_DIR: artifacts/runs/remote_full/nose_s101_224_seed2022
