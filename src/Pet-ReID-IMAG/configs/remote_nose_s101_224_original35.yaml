_BASE_: resnest101_224_baseline.yaml

# Full original-capacity nose-only experiment.  This intentionally restores
# the author recipe instead of inheriting the 8 GB local-GPU compromises.
SEED: 2022

MODEL:
  BACKBONE:
    PRETRAIN: True
    PRETRAIN_PATH: models/pretrained/resnest101-22405ba7.pth

SOLVER:
  AMP:
    ENABLED: False
  OPT: Adam
  MAX_EPOCH: 35
  BASE_LR: 0.00035
  IMS_PER_BATCH: 80
  WARMUP_FACTOR: 0.1
  WARMUP_ITERS: 400
  FREEZE_ITERS: 1000
  CHECKPOINT_PERIOD: 1

DATALOADER:
  SAMPLER_TRAIN: NaiveIdentitySampler
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

DATASETS:
  NAMES: ("PetID",)
  TESTS: ("PetIDValidation",)

TEST:
  EVAL_PERIOD: 1
  IMS_PER_BATCH: 128
  METRIC: cosine

OUTPUT_DIR: artifacts/runs/remote_full/nose_s101_224_original35_seed2022
